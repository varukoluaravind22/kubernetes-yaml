apiVersion: v1 
kind: Service
metadata: 
  name: {{.Values.service.name}}
spec:
  type: {{.Values.service.type}}
  selector:
    {{ toYaml .Values.service.labels | nindent 4 }}: {{.Values.service.app}}
  ports:
    - port: {{.Values.service.port}}
      targetPort: {{.Values.service.targetPort}}
      nodePort: {{.Values.service.nodePort}}